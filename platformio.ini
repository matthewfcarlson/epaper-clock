; PlatformIO Project Configuration File
;
; XIAO ePaper Clock — Seeed Studio XIAO ESP32S3 Plus driving a 7.5" UC8179
; monochrome e-paper display (TRMNL DIY kit).
;
;   Build:        pio run
;   Upload (USB):  pio run -t upload
;   Upload (OTA):  pio run -t upload --upload-port epaper-clock.local
;   Serial monitor: pio device monitor

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; The board definition already sets ARDUINO_USB_CDC_ON_BOOT / BOARD_HAS_PSRAM /
; the OTA-capable default_8MB.csv partition table (two ~3.1MB app slots) —
; no extra build_flags needed for that.

; Seeed's TFT_eSPI fork (Seeed_GFX) picks its board/screen setup from
; BOARD_SCREEN_COMBO, normally via a `driver.h` the Arduino IDE finds because
; it adds the whole sketch folder to every compiler invocation's include
; path. PlatformIO's Library Dependency Finder scopes each library's include
; path independently, so Seeed_GFX/TFT_eSPI.cpp never sees a project
; include/ or src/ dir — these two defines must come from build_flags
; instead, since that's the one thing PlatformIO applies to every
; compilation unit (project and library code alike).
;   502 = 7.5" monochrome ePaper (UC8179); EE04 = this board's pin mapping
build_flags =
    -D BOARD_SCREEN_COMBO=502
    -D USE_XIAO_EPAPER_DISPLAY_BOARD_EE04

lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX.git

monitor_speed = 115200
upload_speed = 115200
; This board's stub-loader handshake over native USB CDC is unreliable
; ("No serial data received" right after "Stub running..."); --no-stub
; talks to the ROM bootloader directly instead (slower, but works).
upload_flags = --no-stub
