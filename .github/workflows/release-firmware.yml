name: Release firmware

# Push a tag matching vX.Y.Z (must match FIRMWARE_VERSION in src/version.h,
# with a leading 'v') to build and publish a GitHub release. Devices poll
# this repo's latest release nightly (see CLAUDE.md's "Firmware auto-update"
# section) and self-flash when the tag is newer than their running version.
#
# Also accepts workflow_dispatch with an explicit `tag` input — tag-release.yml
# uses this right after pushing a new tag, since a tag pushed with the default
# GITHUB_TOKEN does NOT trigger other on:push workflows (GitHub's anti-
# recursion guard exempts workflow_dispatch/repository_dispatch from that,
# which is why this needs both triggers rather than push alone). It's also
# the way to manually re-run a build for an existing tag without re-pushing
# it — deliberately a typed input rather than relying on the "Use workflow
# from" branch/tag selector in the Actions UI, which defaults to the
# selected branch (usually main) and silently builds the wrong thing if you
# forget to change it there instead.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release, e.g. v0.9.8 (must match FIRMWARE_VERSION in src/version.h on that tag)"
        required: true

permissions:
  # softprops/action-gh-release needs this to create the release and generate
  # notes with the default GITHUB_TOKEN — without it the API call 403s with
  # "Resource not accessible by integration" (repo/org default is read-only).
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target tag
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Explicit ref so a workflow_dispatch run always builds the tag named
      # in the `tag` input, regardless of which branch/tag the "Use workflow
      # from" selector was left on when it was triggered.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.tag }}

      - name: Verify tag matches FIRMWARE_VERSION
        run: |
          tag="${{ steps.target.outputs.tag }}"
          version="$(grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' src/version.h | tr -d '"')"
          if [ "${tag#v}" != "$version" ]; then
            echo "::error::Tag ${tag} does not match FIRMWARE_VERSION \"$version\" in src/version.h"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install platformio

      # config.h is gitignored, so the release build assembles it from repo
      # secrets instead of the CI job's placeholder values — this .bin is
      # what devices actually self-flash via the nightly OTA check.
      #
      # WIFI_SSID/WIFI_PASS are deliberately left blank here rather than
      # pulled from secrets: the migration release that copied compiled-in
      # credentials into NVS (setup(), src/main.cpp, right after
      # loadWifiConfig()) has already shipped, so every device now holds its
      # credentials in NVS and no longer needs a compiled-in fallback. From
      # this release on, the public binary never contains a real network's
      # credentials — a freshly flashed device must be provisioned once over
      # serial (see docs/provision.html / CLAUDE.md's "Location & WiFi
      # provisioning").
      #
      # OTA_REPORT_ENDPOINT isn't sensitive (it's just the deployed
      # cloudflare-worker/ URL, see CLAUDE.md's "OTA failure reporting"), but
      # is pulled from a repo secret anyway for consistency with the rest of
      # this step. Fine to leave that secret unset entirely — an empty
      # OTA_REPORT_ENDPOINT just disables the relay auto-report path (the
      # click-to-report flow in docs/provision.html is unaffected).
      - name: Write config.h from secrets
        env:
          TZ_INFO: ${{ secrets.TZ_INFO }}
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          OTA_REPORT_ENDPOINT: ${{ secrets.OTA_REPORT_ENDPOINT }}
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          cat > src/config.h <<EOF
          #pragma once
          const char *WIFI_SSID = "";
          const char *WIFI_PASS = "";
          const char *TZ_INFO = "$TZ_INFO";
          const char *NTP_SERVER1 = "pool.ntp.org";
          const char *NTP_SERVER2 = "time.nist.gov";
          const char *OWM_API_KEY = "$OWM_API_KEY";
          const bool OTA_UPDATES_ENABLED = true;
          const char *OTA_GITHUB_OWNER = "${{ github.repository_owner }}";
          const char *OTA_GITHUB_REPO = "$repo_name";
          const char *OTA_REPORT_ENDPOINT = "$OTA_REPORT_ENDPOINT";
          EOF

      - name: Build firmware
        run: pio run

      - name: Rename build artifact
        run: cp .pio/build/seeed_xiao_esp32s3/firmware.bin firmware.bin

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: firmware.bin
          generate_release_notes: true
